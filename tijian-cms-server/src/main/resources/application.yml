server:
  port: 8088
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
    context-path: /tijiancms
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${TIJIAN_DB_URL:jdbc:mysql://localhost:3306/tijian?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${TIJIAN_DB_USER:root}
    password: ${TIJIAN_DB_PASSWORD}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.neusoft.tijiancms.po
